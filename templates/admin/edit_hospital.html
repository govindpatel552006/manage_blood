{% extends 'admin/base.html' %}
{% block title %}Edit Hospital – Admin{% endblock %}
{% block admin_content %}
<div class="topbar"><h2>Edit Hospital</h2><span class="tag">Admin</span></div>
<div class="page-content">
  {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
  <div class="form-page-wrap">
    <form method="POST">
      <div class="form-group"><label>Hospital Name *</label><input type="text" name="name" value="{{ hospital['H_name'] }}" required></div>
      <div class="form-row">
        <div class="form-group"><label>Contact Person</label><input type="text" name="contact_person" value="{{ hospital['H_con_person'] or '' }}"></div>
        <div class="form-group"><label>Phone *</label><input type="text" name="contact" value="{{ hospital['H_contact'] }}" required></div>
      </div>
      <div class="form-group"><label>Email *</label><input type="email" name="email" value="{{ hospital['H_email'] }}" required></div>
      <div class="form-group"><label>Address</label><input type="text" name="address" value="{{ hospital['H_address'] or '' }}"></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" value="{{ hospital['password'] }}"></div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin_hospitals') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
