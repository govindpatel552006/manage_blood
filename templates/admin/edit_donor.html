{% extends 'admin/base.html' %}
{% block title %}Edit Donor – Admin{% endblock %}
{% block admin_content %}
<div class="topbar"><h2>Edit Donor</h2><span class="tag">Admin</span></div>
<div class="page-content">
  {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
  <div class="form-page-wrap">
    <form method="POST">
      <div class="form-row">
        <div class="form-group"><label>Full Name *</label><input type="text" name="name" value="{{ donor['D_name'] }}" required></div>
        <div class="form-group"><label>Blood Type *</label>
          <select name="blood_type" required>
          {% for b in ['A+','A-','B+','B-','O+','O-','AB+','AB-'] %}
          <option {{ 'selected' if donor['D_bloodtype']==b else '' }}>{{ b }}</option>
          {% endfor %}
          </select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Age *</label><input type="number" name="age" value="{{ donor['D_age'] }}" min="18" max="65" required></div>
        <div class="form-group"><label>Gender *</label>
          <select name="gender" required>
          {% for g in ['Male','Female','Other'] %}
          <option {{ 'selected' if donor['D_gender']==g else '' }}>{{ g }}</option>
          {% endfor %}
          </select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Contact *</label><input type="text" name="contact" value="{{ donor['D_contact'] }}" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ donor['D_email'] or '' }}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>ID Proof</label><input type="text" name="id_proof" value="{{ donor['D_identification'] or '' }}"></div>
        <div class="form-group"><label>Last Donation</label><input type="date" name="last_donation" value="{{ donor['D_Last_Donation'] or '' }}"></div>
      </div>
      <div class="form-group"><label>Address</label><input type="text" name="address" value="{{ donor['D_address'] or '' }}"></div>
      <div class="form-group"><label>Medical History</label>
        <textarea name="medical" rows="3">{{ donor['D_medical'] or '' }}</textarea></div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin_donors') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
