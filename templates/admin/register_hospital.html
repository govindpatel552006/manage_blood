{% extends 'admin/base.html' %}
{% block title %}Register Hospital – Admin{% endblock %}
{% block admin_content %}
<div class="topbar"><h2>Register Hospital</h2><span class="tag">Admin</span></div>
<div class="page-content">
  {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
  <div class="form-page-wrap">
    <form method="POST">
      <div class="form-group"><label>Hospital Name *</label><input type="text" name="name" placeholder="Full hospital name" required></div>
      <div class="form-row">
        <div class="form-group"><label>Contact Person *</label><input type="text" name="contact_person" placeholder="Dr. Name" required></div>
        <div class="form-group"><label>Phone *</label><input type="text" name="contact" placeholder="10-digit number" required></div>
      </div>
      <div class="form-group"><label>Email *</label><input type="email" name="email" placeholder="Hospital email (login)" required></div>
      <div class="form-group"><label>Address</label><input type="text" name="address" placeholder="Full address"></div>
      <div class="form-group"><label>Login Password *</label><input type="password" name="password" placeholder="Set hospital password" required></div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn btn-primary">Register Hospital</button>
        <a href="{{ url_for('admin_hospitals') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
