{% extends 'admin/base.html' %}
{% block title %}Register Donor – Admin{% endblock %}
{% block admin_content %}
<div class="topbar"><h2>Register New Donor</h2><span class="tag">Admin</span></div>
<div class="page-content">
  {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
  <div class="form-page-wrap">
    <form method="POST">
      <div class="form-row">
        <div class="form-group"><label>Full Name *</label><input type="text" name="name" placeholder="Full name" required></div>
        <div class="form-group"><label>Blood Type *</label>
          <select name="blood_type" required><option value="">Select</option>
          {% for b in ['A+','A-','B+','B-','O+','O-','AB+','AB-'] %}<option>{{ b }}</option>{% endfor %}
          </select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Age *</label><input type="number" name="age" min="18" max="65" placeholder="Age" required></div>
        <div class="form-group"><label>Gender *</label>
          <select name="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Contact *</label><input type="text" name="contact" placeholder="10-digit number" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="Email address"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>ID Proof (Aadhar/PAN)</label><input type="text" name="id_proof" placeholder="ID number"></div>
        <div class="form-group"><label>Last Donation Date</label><input type="date" name="last_donation"></div>
      </div>
      <div class="form-group"><label>Address</label><input type="text" name="address" placeholder="Full address"></div>
      <div class="form-group"><label>Medical History</label>
        <textarea name="medical" rows="3" placeholder="Any known medical conditions..."></textarea></div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn btn-primary">Register Donor</button>
        <a href="{{ url_for('admin_donors') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
